name: Build SeaMonkey AppImage Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SeaMonkey version (e.g., 2.53.24)'
        required: true
        default: '2.53.24'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container: archlinux:latest 

    steps:
      - name: Install System Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git wget bzip2 xorg-server-xvfb patchelf zsync awk gtk3 dbus-glib libxt alsa-lib nss nspr

      - name: Build SeaMonkey AppImage
        run: |
          #!/bin/bash
          set -e

          VERSION="${{ github.event.inputs.version }}"
          
          mkdir -p seamonkey-src/usr/bin
          
          wget -qO seamonkey.tar.bz2 "https://archive.seamonkey-project.org/releases/${VERSION}/linux-x86_64/en-US/seamonkey-${VERSION}.en-US.linux-x86_64.tar.bz2"
          tar -xjf seamonkey.tar.bz2 -C seamonkey-src/usr/bin
          rm seamonkey.tar.bz2

          cat << 'EOF' > seamonkey-src/usr/bin/seamonkey-launcher
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/seamonkey/seamonkey" "$@"
          EOF
          chmod +x seamonkey-src/usr/bin/seamonkey-launcher

          mkdir -p seamonkey-src/usr/share/applications seamonkey-src/usr/share/icons/hicolor/128x128/apps
          cp seamonkey-src/usr/bin/seamonkey/chrome/icons/default/default128.png seamonkey-src/usr/share/icons/hicolor/128x128/apps/seamonkey.png || wget -qO seamonkey-src/usr/share/icons/hicolor/128x128/apps/seamonkey.png "https://upload.wikimedia.org/wikipedia/commons/4/46/SeaMonkey_Icon.png"

          cat << EOF > seamonkey-src/usr/share/applications/seamonkey.desktop
          [Desktop Entry]
          Type=Application
          Name=SeaMonkey
          Exec=seamonkey-launcher
          Icon=seamonkey
          Terminal=false
          Categories=Network;WebBrowser;Email;
          EOF

          git clone https://github.com/pkgforge-dev/anylinux-appimages.git
          chmod +x ./anylinux-appimages/useful-tools/quick-sharun.sh
          chmod +x ./anylinux-appimages/useful-tools/get-debloated-pkgs.sh

          ./anylinux-appimages/useful-tools/get-debloated-pkgs.sh --add-common --prefer-nano

          export ICON="$(pwd)/seamonkey-src/usr/share/icons/hicolor/128x128/apps/seamonkey.png"
          export DESKTOP="$(pwd)/seamonkey-src/usr/share/applications/seamonkey.desktop"
          export OUTPATH="$(pwd)"
          export OUTNAME="SeaMonkey-x86_64.AppImage"

          mkdir -p AppDir/bin
          ( sleep 15 && pkill -x seamonkey-bin || pkill -x seamonkey || true ) &
          xvfb-run -a ./anylinux-appimages/useful-tools/quick-sharun.sh seamonkey-src/usr/bin/seamonkey-launcher || true
          cp -r seamonkey-src/usr/bin/seamonkey AppDir/bin/

          ./anylinux-appimages/useful-tools/quick-sharun.sh --make-appimage

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.version }}"
          name: "SeaMonkey ${{ github.event.inputs.version }}"
          files: "SeaMonkey-x86_64.AppImage"
          prerelease: false
